# Copy to configs/paths.yaml (gitignored) and edit for your machine.
# Relative paths are resolved relative to THIS file's directory.
# Alternatively point the EOB_PATHS environment variable at any YAML with these keys.

coco:
  annotations: /path/to/coco/annotations        # contains instances_{train,val}2017.json
  val_images: /path/to/coco/val2017             # official val2017 JPEGs (5,000 files)
  train_images: /path/to/coco/train2017_subset  # selectively downloaded train2017 JPEGs
  image_base_url: https://s3.amazonaws.com/images.cocodataset.org

model:
  dir: /path/to/Qwen3.5-4B                      # local snapshot of Qwen/Qwen3.5-4B @ pinned revision

# Everything the pipeline generates (manifests, annotations, rendered PNGs, predictions,
# results, figures, release staging). Kept outside the Git repository.
work_root: /path/to/evidence_ownership_work

# Optional: SAM-HQ point-prompt assistance in the annotation tool (decision D-016).
# sam:
#   repo: /path/to/sam-hq              # checkout of https://github.com/SysCV/sam-hq (provides segment_anything)
#   checkpoint: /path/to/sam_hq_vit_l.pth
#   model_type: vit_l
#   device: cuda:0                     # index within CUDA_VISIBLE_DEVICES
